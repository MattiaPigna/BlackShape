<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Render guscio capelli</title>
<style>body{margin:0;background:#111;color:#ccc;font:14px sans-serif}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../lib/three.module.js"}}</script>
</head><body>
<div id="log">render…</div>
<script type="module">
// Renderizza la testa con i capelli 3D (modelli/guscio/<id>.glb da tools/guscio-capelli.py) negli angoli del giro
// (?n=120 -> uno ogni 3 gradi). ?id=a,b,c renderizza piu' tagli in fila.
// Per ogni angolo 3 immagini in modelli/viste/g-<id>/: argilla illuminata (c), colore capelli (h), alpha capelli (a).
// tools/componi-giro.py le unisce nei fotogrammi finali. Serve tools/server-salva.py.
import * as THREE from 'three';
import { GLTFLoader } from './node_modules/three/examples/jsm/loaders/GLTFLoader.js';

const Q = new URLSearchParams(location.search);
const ids = Q.get('id').split(',');
const S = 1024, STEPS = +(Q.get('n') || 120);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(S, S); r.setPixelRatio(1);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
document.body.appendChild(r.domElement);
const log = document.getElementById('log');

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.1));
const clay = new THREE.MeshStandardMaterial({ color: 0xa3a3a5, roughness: 0.75, metalness: 0, vertexColors: true });
// col4 = capelli (colore premoltiplicato + alpha). I vertici con A=0 e B=1 sono sopracciglia/baffi (R = intensita'):
// niente capelli li', ma l'argilla viene scurita (vedi 'color' qui sotto)
const vsh = `attribute vec4 col4; varying vec4 vC; void main(){ vC = (col4.a < 0.004 && col4.b > 0.9) ? vec4(0.0) : col4; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const hairCol = new THREE.ShaderMaterial({ vertexShader: vsh, fragmentShader: `varying vec4 vC; void main(){ gl_FragColor = vec4(vC.rgb, 1.0); }` });
const hairA = new THREE.ShaderMaterial({ vertexShader: vsh, fragmentShader: `varying vec4 vC; void main(){ gl_FragColor = vec4(vec3(vC.a), 1.0); }` });

// stessa camera e luci di render-viste.html (il busto calvo originale definisce l'inquadratura)
const base = (await new GLTFLoader().loadAsync('../modelli/Meshy_AI_Stern_Bald_Head_Study_1105104142_generate.glb')).scene;
const box = new THREE.Box3().setFromObject(base);
const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
const R = Math.max(sz.x, sz.y, sz.z);
const key = new THREE.DirectionalLight(0xffffff, 2.2), fill = new THREE.DirectionalLight(0xffffff, 0.7), rim = new THREE.DirectionalLight(0xffffff, 1.2);
scene.add(key, fill, rim, key.target, fill.target, rim.target);
const cam = new THREE.PerspectiveCamera(22, 1, R * 0.1, R * 20);
const bg = new THREE.Color(0x2b2b2d), black = new THREE.Color(0x000000);

for (const id of ids) {
  const head = (await new GLTFLoader().loadAsync(`../modelli/guscio/${id}.glb?t=${Date.now()}`)).scene;
  const meshes = [];
  head.traverse((o) => {
    if (o.isMesh) {
      o.geometry.computeVertexNormals();
      const cc = o.geometry.getAttribute('color');
      const a = new Float32Array(cc.count * 4);
      for (let i = 0; i < cc.count; i++) { a[i * 4] = cc.getX(i); a[i * 4 + 1] = cc.getY(i); a[i * 4 + 2] = cc.getZ(i); a[i * 4 + 3] = cc.itemSize > 3 ? cc.getW(i) : 1; }
      o.geometry.setAttribute('col4', new THREE.BufferAttribute(a, 4));
      const k = new Float32Array(cc.count * 3);    // argilla: 1 = normale, piu' scuro su sopracciglia e baffi
      for (let i = 0; i < cc.count; i++) {
        const peli = (a[i * 4 + 3] < 0.004 && a[i * 4 + 2] > 0.9) ? a[i * 4] : 0;
        const f = 1 - 0.78 * peli;
        k[i * 3] = f; k[i * 3 + 1] = f * 0.97; k[i * 3 + 2] = f * 0.95;
      }
      const pel = o.geometry.getAttribute('_pelle');   // pelle realistica (tools/pelle.py), albedo lineare
      if (pel) for (let i = 0; i < cc.count; i++) { k[i * 3] *= pel.getX(i) / 0.366; k[i * 3 + 1] *= pel.getY(i) / 0.366; k[i * 3 + 2] *= pel.getZ(i) / 0.373; }
      o.geometry.setAttribute('color', new THREE.BufferAttribute(k, 3));
      meshes.push(o);
    }
  });
  scene.add(head);
  const shot = async (name) => {
    r.render(scene, cam);
    const blob = await new Promise((ok) => r.domElement.toBlob(ok, 'image/png'));
    await fetch(`/salva?nome=g-${id}/${name}.png`, { method: 'POST', body: blob });
  };
  for (let k = 0; k < STEPS; k++) {
    const ang = THREE.MathUtils.degToRad(k * 360 / STEPS);
    const dir = new THREE.Vector3(Math.sin(ang), 0.08, Math.cos(ang)).normalize();
    const dist = R * 0.5 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * 1.15;
    cam.position.copy(c).addScaledVector(dir, dist);
    cam.lookAt(c);
    const side = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
    key.position.copy(c).addScaledVector(dir, 3 * R).addScaledVector(side, -2 * R).add(new THREE.Vector3(0, 2 * R, 0));
    fill.position.copy(c).addScaledVector(dir, 3 * R).addScaledVector(side, 2.5 * R);
    rim.position.copy(c).addScaledVector(dir, -3 * R).add(new THREE.Vector3(0, 1.5 * R, 0));
    [key, fill, rim].forEach((l) => l.target.position.copy(c));
    const kk = String(k).padStart(3, '0');
    scene.background = bg; meshes.forEach((m) => (m.material = clay)); await shot('c' + kk);
    scene.background = black; meshes.forEach((m) => (m.material = hairCol)); await shot('h' + kk);
    meshes.forEach((m) => (m.material = hairA)); await shot('a' + kk);
    log.textContent = id + ' angolo ' + k + '/' + STEPS;
  }
  await fetch(`/salva?nome=g-${id}/fatto.txt`, { method: 'POST', body: 'ok' });
  scene.remove(head);
  meshes.forEach((m) => m.geometry.dispose());
}
log.textContent += ' FATTO';
document.title = 'FATTO';
</script></body></html>
